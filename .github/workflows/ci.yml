name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: API tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: RoadGuard/server/requirements*.txt
      - run: pip install -r RoadGuard/server/requirements-dev.txt
      - run: pytest RoadGuard/server/tests -q

  stack:
    name: Docker stack smoke test (PostgreSQL + API + Caddy)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - name: Start the production stack
        run: |
          echo "POSTGRES_PASSWORD=ci$(openssl rand -hex 12)" > .env
          docker compose up -d --build
      - name: Smoke test through Caddy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1/health/ready; then break; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1/health | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='ok' and d['database']['provider']=='PostgreSQL', d; print(d['database'], d['ml_engine'])"
          curl -fsS http://127.0.0.1/ | grep -q "ROADGUARD HUD"
          curl -fsS -X POST http://127.0.0.1/api/test/event -H 'Content-Type: application/json' -d '{"event_type":"POTHOLE"}'
          curl -fsS "http://127.0.0.1/api/hazards?source=TEST" | python3 -c "import json,sys; assert len(json.load(sys.stdin)) == 1"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
